name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # No secrets are available in CI — the build must work without them.
      # A placeholder google-services.json satisfies the Google Services plugin.
      - name: Provide placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 📦 Download the built APK from the run's "Artifacts" section
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
